# 분석과업 3 (v2) — 재선정 미래도전기술 5개의 요소기술 특허 수집 검색식
# 근거: 통합보고서 v3 제7장 7.10.2~7.10.6절(기술 명세의 핵심 접근 A~C와 요소 구성)
#
# v1(patent_queries.yaml)과의 차이
#   1) 대상: F01·F02·F03·F04·F06 (F05는 후보에서 제외, 검색하지 않음)
#   2) 요소마다 role을 둔다.
#        base : 기존 기술의 축적 범주 — 선행기술이 얼마나 쌓였는지(활용/확장 판단)
#        core : 도전 시그니처 — 7.10절 핵심 접근의 결합 조건. 적중이 적을수록 신규 개발 근거
#      core 요소는 대응 base 요소의 블록에 결합 블록을 추가한 형태다(base ⊇ core 관계를 의도).
#   3) approach: 7.10절의 핵심 접근(A·B·C) 또는 기반(X)과의 대응
#   4) v1에 없던 기능(관측 품질 가중, 재정합, 생존 확률지도, 버전 동기화, 의존관계 식별,
#      관측 우선순위, 변경 설명)을 새 요소로 추가
#
# 매칭 규칙(요소별, v1과 동일): (모든 blocks 충족) AND (재난 맥락어 OR [F 공통 CPC + 요소 CPC])
#   블록 안 용어는 OR, 블록끼리는 AND. 영문은 단어 시작 경계·공백/하이픈 변형 허용, 국문은 부분 일치.
# ※ CPC는 후보다. 실행 전에 EPO CPC 분류표에서 정의를 확인하고 조정한다.
# ※ v1 후보 테이블(pat_candidates)에 없는 CPC와 맥락어가 추가되었으므로 stage1을 다시 실행해야 한다.

