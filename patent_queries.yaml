# 분석과업 3 — Google Patents Public Data(BigQuery) 특허 수집 검색식
# 근거: 분석과업 2 보고서 제7장 7.7절(F01~F06 기능·정보흐름·검색 시드)과 표 7-26(과업 3 인계)
#
# 구조
#   settings  : GCP 프로젝트·기간·국가·비용 상한
#   context   : 재난·안전 맥락어 (영문/국문)
#   techs     : 미래도전기술(F01~F06)
#     cpc       : 해당 F의 모든 요소기술에 공통으로 쓰는 CPC/IPC 접두어(공백 없이, 예: G08B21/10)
#     elements  : 요소기술(E1, E2 …). 7.7절 "검색" 문단의 요소기술 분해를 그대로 따름
#       blocks  : 기능 블록. 블록 안 용어는 OR, 블록끼리는 AND
#       cpc     : 이 요소기술에만 추가하는 CPC(선택)
#
#   매칭 규칙(요소기술별): (모든 blocks 충족) AND (재난 맥락어 OR [F 공통 CPC + 요소 CPC])
#   F 단위 결과 = 요소기술 결과의 합집합(패밀리 기준)
#
# ※ CPC는 후보입니다. EPO CPC 분류표/WIPO IPCPUB에서 정의를 확인하고 조정하세요.
# ※ 새 CPC를 추가하면 stage1(후보 테이블)을 다시 만들어야 합니다(스크립트가 경고).
# ※ 영문 용어는 대소문자·공백·하이픈 변형을 자동 허용합니다(heat wave = heat-wave = heatwave).
#   단어 시작 경계만 걸리므로 "cascad"처럼 어간만 써도 cascade/cascading이 함께 잡힙니다.

settings:
