  dataset: patents_work             # 후보 테이블을 저장할 내 데이터셋
  location: US                      # 공개 데이터셋 위치와 동일해야 함
  filing_from: 20060101             # 출원일 YYYYMMDD (20년)
  filing_to: 20251231               # 최근 18개월 출원은 미공개분이 있어 건수가 과소 집계됨
  countries: [KR, US, EP, JP, CN, WO]
  search_claims: false              # true면 청구항까지 검색(스캔량 크게 증가)
  max_gb_billed: 600                # 쿼리 1회 과금 상한(GB). 넘으면 실행 거부

